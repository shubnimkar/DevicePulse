# /etc/nginx/sites-available/devicepulse
# nginx runs on the host; API and dashboard listen on host loopback.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name devicepulse.waybeyond.tech;

    server_tokens off;
    client_max_body_size 100M;

    # Begin with one day. After confirming all HTTPS behavior, use 31536000.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ssl_certificate /etc/letsencrypt/live/devicepulse.waybeyond.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devicepulse.waybeyond.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Preferred API path for the dashboard and newly built agents. Leaving the
    # URI off proxy_pass preserves /api/...; the Go server handles that prefix.
    location = /api {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;
    }

    # Compatibility for agents and old dashboard builds that use root API
    # paths. This also covers routes missing from the previous nginx config:
    # /commands, /reports, /users, and /health.
    location ~ ^/(auth|commands|devices|focus|health|ingest|policy|reports|update|users)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;
        proxy_hide_header X-Powered-By;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name devicepulse.waybeyond.tech;
    return 301 https://$host$request_uri;
}
