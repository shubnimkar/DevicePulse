# Include inside the HTTPS server {} block only, then nginx -t and reload.
# Start with one day; increase after verifying the production deployment.
# Deliberately does not include subdomains or request browser preload.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
